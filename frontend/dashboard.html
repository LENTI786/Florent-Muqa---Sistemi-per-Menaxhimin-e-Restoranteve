
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Sistemi i Restorantit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

            <div>
                <h1 class="mb-1">Dashboard</h1>
                <p class="text-muted mb-0" id="welcome-message">
                    Mirë se erdhe!
                </p>
            </div>

            <button id="refresh-dashboard" class="btn btn-primary">
                Rifresko të dhënat
            </button>

        </div>

        <div id="alert"></div>

        <div id="dashboard-loading" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="text-muted mt-3">Duke ngarkuar të dhënat...</p>
        </div>

        <div id="dashboard-content" class="d-none">

            <!-- Statistikat -->
            <div class="row g-4 mb-4" id="dashboard-stats"></div>

            <!-- Porositë e fundit -->
            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 fw-bold mb-0">
                            Porositë e fundit
                        </h2>

                        <a href="orders.html" class="btn btn-outline-primary btn-sm">
                            Shiko të gjitha
                        </a>
                    </div>

                    <div id="recent-orders"></div>

                </div>

            </div>

        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
