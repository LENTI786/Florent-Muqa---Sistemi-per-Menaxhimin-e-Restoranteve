
<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pagesat | Sistemi i Restorantit</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="navbar"></div>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold">Menaxhimi i pagesave</h1>

            <p class="text-muted">
                Regjistro pagesat për porositë e shërbyera.
            </p>
        </div>

        <div id="alert"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <p class="text-muted mb-1">Porosi në pritje të pagesës</p>
                    <h2 id="payable-count" class="h3 fw-bold mb-0">0</h2>
                </div>

                <button
                    type="button"
                    id="refresh-payments"
                    class="btn btn-outline-primary"
                >
                    Rifresko
                </button>
            </div>
        </div>

        <h2 class="h5 fw-bold mb-3">Porositë e shërbyera</h2>

        <div id="payments-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Duke ngarkuar porositë...</p>
        </div>

        <div id="payments-content"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/payments.js"></script>

</body>
</html>
