<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyrja | Sistemi i Restorantit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Sistemi i Restorantit</h1>
            <p class="text-muted text-center mb-4">Hyr në llogarinë tënde</p>

            <div id="alert"></div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Fjalëkalimi</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password">
              </div>
              <button type="submit" id="login-btn" class="btn btn-primary w-100">Hyr</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
