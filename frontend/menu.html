
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menuja | Sistemi i Restorantit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="navbar"></div>

    <main class="container py-4">

        <!-- Titulli dhe butoni për shtim -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">

            <h1 class="h3 mb-0">Menuja</h1>

            <button
                id="add-menu-item"
                class="btn btn-primary d-none"
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#menu-item-modal">

                + Shto ushqim

            </button>

        </div>

        <div id="alert"></div>

        <!-- Ngarkimi -->
        <div id="loading" class="text-center py-5">

            <div class="spinner-border" role="status"></div>

            <p class="mt-2 text-muted">
                Duke ngarkuar menunë...
            </p>

        </div>

        <!-- Lista e ushqimeve -->
        <div id="menu-content"></div>

    </main>


    <!-- Modal për shtimin dhe ndryshimin e ushqimeve -->
    <div class="modal fade" id="menu-item-modal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="menu-modal-title">
                        Shto ushqim të ri
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <form id="menu-item-form">

                    <div class="modal-body">

                        <div id="modal-alert"></div>

                        <!-- Emri -->
                        <div class="mb-3">

                            <label for="item-name" class="form-label">
                                Emri i ushqimit
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="item-name"
                                maxlength="120"
                                required>

                        </div>

                        <!-- Kategoria -->
                        <div class="mb-3">

                            <label for="item-category" class="form-label">
                                Kategoria
                            </label>

                            <select
                                class="form-select"
                                id="item-category"
                                required>

                                <option value="">
                                    Zgjidh kategorinë
                                </option>

                            </select>

                        </div>

                        <!-- Çmimi -->
                        <div class="mb-3">

                            <label for="item-price" class="form-label">
                                Çmimi
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="item-price"
                                min="0.01"
                                max="9999.99"
                                step="0.01"
                                required>

                        </div>

                        <!-- Disponueshmëria -->
                        <div class="form-check">

                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="item-available"
                                checked>

                            <label
                                class="form-check-label"
                                for="item-available">

                                Ushqimi është i disponueshëm

                            </label>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Anulo

                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="save-menu-item">

                            Ruaj ushqimin

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript i projektit -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/menu.js"></script>

</body>
</html>
