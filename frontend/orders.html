
<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Porositë | Sistemi i Restorantit</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="navbar"></div>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold">Menaxhimi i porosive</h1>

            <p class="text-muted">
                Krijo dhe përcill porositë e restorantit.
            </p>
        </div>

        <div id="alert"></div>

        <!-- Krijimi i porosisë -->
        <div id="create-order-card" class="card shadow-sm mb-4 d-none">

            <div class="card-body">

                <h2 class="h5 fw-bold mb-3">
                    Krijo porosi të re
                </h2>

                <form id="order-form">

                    <div class="mb-4">

                        <label for="order-table" class="form-label">
                            Zgjedh tavolinën
                        </label>

                        <select
                            id="order-table"
                            class="form-select"
                            required
                        >
                            <option value="">Duke ngarkuar tavolinat...</option>
                        </select>

                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h3 class="h6 fw-bold mb-0">
                            Produktet
                        </h3>

                        <button
                            type="button"
                            id="add-order-item"
                            class="btn btn-outline-primary btn-sm"
                        >
                            + Shto produkt
                        </button>

                    </div>

                    <div id="order-items"></div>

                    <div class="order-total mt-4 p-3 rounded">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold">Totali i përafërt:</span>

                            <strong id="order-total" class="fs-5">
                                0.00 €
                            </strong>
                        </div>

                        <small class="text-muted">
                            Totali përfundimtar llogaritet nga serveri.
                        </small>
                    </div>

                    <button
                        type="submit"
                        id="submit-order"
                        class="btn btn-primary mt-4"
                    >
                        Krijo porosinë
                    </button>

                </form>

            </div>
        </div>


        <!-- Lista e porosive -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">

            <h2 class="h5 fw-bold mb-0">
                Lista e porosive
            </h2>

            <div class="d-flex gap-2">

                <select id="status-filter" class="form-select form-select-sm">

                    <option value="">Të gjitha statuset</option>
                    <option value="NEW">E re</option>
                    <option value="IN_PREPARATION">Në përgatitje</option>
                    <option value="READY">Gati</option>
                    <option value="SERVED">E shërbyer</option>
                    <option value="PAID">E paguar</option>
                    <option value="CANCELLED">E anuluar</option>

                </select>

                <button
                    type="button"
                    id="refresh-orders"
                    class="btn btn-outline-primary btn-sm"
                >
                    Rifresko
                </button>

            </div>

        </div>


        <div id="orders-loading" class="text-center py-5">

            <div class="spinner-border text-primary" role="status"></div>

            <p class="text-muted mt-2">
                Duke ngarkuar porositë...
            </p>

        </div>

        <div id="orders-content"></div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/orders.js"></script>

</body>
</html>
